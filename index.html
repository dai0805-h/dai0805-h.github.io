<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dai Apps</title>
<style>
  :root { --ink:#2b2b2b; --sub:#666; --bg:#f6f6f4; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eee; --sub:#aaa; --bg:#191919; --card:#262626; } }
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; }
  main { max-width:680px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:1.6rem; }
  a.app { display:flex; gap:16px; align-items:center; background:var(--card); border-radius:16px; padding:16px; margin:12px 0; color:inherit; text-decoration:none; }
  a.app img { width:64px; height:64px; border-radius:14px; }
  .sub { color:var(--sub); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Dai Apps</h1>
  <p class="sub">iPhoneアプリのサポートページ</p>
  <a class="app" href="/okan/"><img src="/okan/icon.png" alt=""><div><b>おかんの一言</b><div class="sub">サポート・プライバシーポリシー</div></div></a>
  <a class="app" href="/stretch-shukan/"><img src="/stretch-shukan/icon.png" alt=""><div><b>ストレッチ習慣</b><div class="sub">サポート・プライバシーポリシー</div></div></a>
</main>
</body>
</html>
